services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: event-ticketing-platform
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql

    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        depends_on:
            - mysql
        env_file:
            - .env

volumes:
    mysql-data:
